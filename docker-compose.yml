name: acs

services:
  acs:
    build:
      context: .
      dockerfile: Dockerfile
    image: acs:local
    init: true
    # 0.0.0.0 publishes the observer and API on every host interface, so other
    # computers on the LAN can open http://<host-lan-ip>:8787. The process
    # inside the container also listens on 0.0.0.0 (HOST).
    ports:
      - "0.0.0.0:8787:8787"
    environment:
      ACS_DB: /app/data/acs.db
      PORT: "8787"
      HOST: 0.0.0.0
      NODE_NO_WARNINGS: "1"
    volumes:
      # The database and its WAL/SHM files live next to acs.db, so the whole
      # directory has to be the mount. State survives rebuilds and reboots.
      - ./data:/app/data
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 4s
      retries: 30
      start_period: 8s
